version: "3.9"

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-supersecretchangeme}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: grid_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ── IoT Simulator (optional standalone service) ──────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid_simulator
    command: >
      sh -c "cd /app/backend && python simulator.py --url http://backend:8000 --rate 1"
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - simulator        # Start with: docker compose --profile simulator up
